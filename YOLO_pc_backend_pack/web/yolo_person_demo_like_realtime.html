<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>YOLO Demo（PC 本地推理）</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#0b1020;color:#e8edf4}
  .top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(0,255,255,.15);position:sticky;top:0;background:rgba(11,16,32,.75);backdrop-filter:blur(8px)}
  .pill{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid rgba(0,255,255,.15);border-radius:999px;background:rgba(255,255,255,.04);font-size:12px}
  .dot{width:8px;height:8px;border-radius:999px;background:#ffaa00}
  .dot.ok{background:#00ff88}
  .dot.bad{background:#ff4444}
  .main{padding:14px;display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
  @media(max-width:980px){.main{grid-template-columns:1fr}}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(0,255,255,.15);border-radius:16px;overflow:hidden}
  .h{padding:12px 14px;border-bottom:1px solid rgba(0,255,255,.15);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .b{padding:14px}
  .btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(0,255,255,.15);background:rgba(255,255,255,.03);color:#e8edf4;cursor:pointer}
  .btn.primary{background:rgba(0,255,255,.12)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .field{display:flex;flex-direction:column;gap:6px;min-width:200px}
  .field label{font-size:12px;color:#8b95a8}
  .field input{padding:10px 12px;border-radius:12px;border:1px solid rgba(0,255,255,.15);background:rgba(255,255,255,.03);color:#e8edf4}
  .stage{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.06)}
  video,canvas{width:100%;display:block}
  canvas.overlay{position:absolute;left:0;top:0;pointer-events:none}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .small{font-size:12px;color:#8b95a8;line-height:1.55}
</style>
</head>
<body>
  <div class="top">
    <div>
      <div style="font-weight:700">YOLO Person Demo（PC 本地推理）</div>
      <div class="small">后端跑在本机：<span class="mono">http://127.0.0.1:8005</span>（不用 portproxy）</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="pill"><span class="dot" id="dot"></span><span id="backendText">backend: unknown</span></div>
      <div class="pill"><span class="mono" id="latText">lat_ms: -</span></div>
      <div class="pill"><span class="mono" id="boxText">boxes: -</span></div>
      <div class="pill"><span class="mono" id="usedText">used: -</span></div>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <div class="h">
        <b>视频 / 摄像头</b>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="btnCam">摄像头</button>
          <button class="btn" id="btnVideo">导入视频</button>
          <input id="videoFile" type="file" accept="video/*" style="display:none"/>
          <button class="btn primary" id="btnRun" disabled>开始推理</button>
          <button class="btn" id="btnStop" disabled>停止</button>
        </div>
      </div>
      <div class="b">
        <div class="stage">
          <video id="vid" playsinline muted></video>
          <canvas id="hidden" style="display:none"></canvas>
          <canvas id="overlay" class="overlay"></canvas>
        </div>
        <div class="small" style="margin-top:10px">
          本页每隔 N ms 抓取一帧 → POST <span class="mono">/infer_image</span> → 画框展示。
        </div>
      </div>
    </div>

    <div class="card">
      <div class="h"><b>连接 / 参数</b></div>
      <div class="b">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
          <div class="field">
            <label>后端 URL</label>
            <input id="backendUrl" value="http://127.0.0.1:8005"/>
          </div>
          <div class="field">
            <label>推理间隔（ms）</label>
            <input id="intervalMs" type="number" value="200" min="50" step="10"/>
          </div>
          <div class="field">
            <label>置信度阈值</label>
            <input id="confTh" type="number" value="0.25" min="0" max="1" step="0.01"/>
          </div>
<div class="field">
  <label>IOU（NMS）</label>
  <input id="iouTh" type="number" value="0.45" min="0" max="1" step="0.01"/>
</div>
<div class="field">
  <label>imgsz</label>
  <input id="imgsz" type="number" value="640" min="128" max="1280" step="32"/>
</div>
        </div>
        <button class="btn" id="btnHealth">检查 /health</button>
        <span class="mono" id="healthText" style="margin-left:10px">-</span>
        <div class="small" style="margin-top:10px">
          启动方式：<span class="mono">python -m http.server 8000</span> 打开本页面；另开一个终端运行 <span class="mono">start_pc_backend.bat</span> 启动后端。
        </div>
      </div>
    </div>
  </div>

<script>
const vid = document.getElementById('vid');
const overlay = document.getElementById('overlay');
const hidden = document.getElementById('hidden');

const dot = document.getElementById('dot');
const backendText = document.getElementById('backendText');
const latText = document.getElementById('latText');
const boxText = document.getElementById('boxText');
const usedText = document.getElementById('usedText');

const backendUrlEl = document.getElementById('backendUrl');
const intervalEl = document.getElementById('intervalMs');
const confEl = document.getElementById('confTh');
const iouEl = document.getElementById('iouTh');
const imgszEl = document.getElementById('imgsz');
const healthText = document.getElementById('healthText');

const btnCam = document.getElementById('btnCam');
const btnVideo = document.getElementById('btnVideo');
const btnRun = document.getElementById('btnRun');
const btnStop = document.getElementById('btnStop');
const btnHealth = document.getElementById('btnHealth');
const videoFile = document.getElementById('videoFile');

let timer=null, stream=null;
let running=false;
let runToken=0;

function setStatus(ok, text){
  backendText.textContent = text;
  dot.classList.remove('ok','bad');
  dot.classList.add(ok ? 'ok' : 'bad');
}
async function checkHealth(){
  const base = backendUrlEl.value.replace(/\/$/,'');
  try{
    const r = await fetch(base + "/health", {cache:"no-store"});
    const j = await r.json();
    healthText.textContent = r.ok ? "OK" : "FAIL";
    setStatus(!!j.ok, `backend: ${j.backend || 'pc'} @ ${base}`);
    return !!j.ok;
  }catch(e){
    healthText.textContent = "ERR";
    setStatus(false, "backend: unreachable");
    return false;
  }
}
btnHealth.onclick = checkHealth;

btnVideo.onclick = ()=> videoFile.click();
videoFile.onchange = ()=>{
  const f = videoFile.files?.[0];
  if (!f) return;
  stopAll();
  vid.src = URL.createObjectURL(f);
  vid.loop = true;
  vid.controls = true;
  vid.play();
  btnRun.disabled = false;
};

btnCam.onclick = async ()=>{
  stopAll();
  stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  vid.srcObject = stream;
  vid.controls = false;
  await vid.play();
  btnRun.disabled = false;
};

function stopAll(){
  // stop loop & invalidate pending responses
  running = false;
  runToken++;
  if (timer){ clearInterval(timer); timer=null; } // legacy
  btnStop.disabled = true;
  btnRun.disabled = false;
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}
btnStop.onclick = stopAll;

function syncOverlay(){
  const r = vid.getBoundingClientRect();
  overlay.width = Math.max(2, Math.round(r.width));
  overlay.height= Math.max(2, Math.round(r.height));
}
function drawBoxes(dets, imgW, imgH){
  syncOverlay();
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0,0,overlay.width,overlay.height);
  const sx = overlay.width / imgW, sy = overlay.height / imgH;

  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0,255,136,0.95)";
  ctx.fillStyle = "rgba(0,255,136,0.95)";
  ctx.font = "14px ui-monospace, Menlo, Consolas, monospace";

  dets.forEach(d=>{
    const [x1,y1,x2,y2] = d.xyxy;
    const x=x1*sx, y=y1*sy, w=(x2-x1)*sx, h=(y2-y1)*sy;
    ctx.strokeRect(x,y,w,h);
    const txt = `${d.cls} ${(d.conf*100).toFixed(0)}%`;
    const tw = ctx.measureText(txt).width + 10;
    ctx.fillRect(x, Math.max(0,y-18), tw, 18);
    ctx.fillStyle = "#001018";
    ctx.fillText(txt, x+5, Math.max(14,y-5));
    ctx.fillStyle = "rgba(0,255,136,0.95)";
  });
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function captureBlob(){
  const W = vid.videoWidth || 640;
  const H = vid.videoHeight || 480;
  hidden.width=W; hidden.height=H;
  hidden.getContext('2d').drawImage(vid,0,0,W,H);
  return new Promise(res=> hidden.toBlob(b=>res({blob:b,w:W,h:H}), "image/jpeg", 0.85));
}
async function inferOnce(token){
  const base = backendUrlEl.value.replace(/\/$/,'');
  const {blob,w,h} = await captureBlob();
  const fd = new FormData();
  fd.append("file", blob, "frame.jpg");
  const confVal = Math.max(0, Math.min(1, parseFloat(confEl.value || "0.25")));
  const iouVal = Math.max(0, Math.min(1, parseFloat(iouEl.value || "0.45")));
  const imgszVal = Math.max(128, parseInt(imgszEl.value || "640", 10) || 640);
  fd.append("conf", String(confVal));
  fd.append("iou", String(iouVal));
  fd.append("imgsz", String(imgszVal));
  const t0 = performance.now();
  const r = await fetch(base + "/infer_image", {method:"POST", body:fd});
  const t1 = performance.now();
  if (!r.ok){
    latText.textContent = `lat_ms: ERR (${Math.round(t1-t0)}ms)`;
    setStatus(false, `backend: ${base} (HTTP ${r.status})`);
    return;
  }
  const j = await r.json();

  // If user stopped / restarted, ignore stale responses
  if (!running || token !== runToken){
    return;
  }

  // Show backend-used params to confirm dynamic settings really applied
  if (usedText){
    const cu = (j.conf_used ?? confVal);
    const iu = (j.iou_used ?? iouVal);
    const su = (j.imgsz_used ?? imgszVal);
    usedText.textContent = `used: conf=${cu} iou=${iu} imgsz=${su}`;
  }

  const th = Math.max(0, Math.min(1, parseFloat(confEl.value||"0.25"))); // 与发送到后端的 confVal 一致
  const dets = (j.detections||[]).filter(d => (d.conf??0) >= th);

  latText.textContent = `lat_ms: ${j.lat_ms ?? Math.round(t1-t0)}`;
  boxText.textContent = `boxes: ${dets.length}`;
  setStatus(true, `backend: ${j.backend || 'pc'} @ ${base}`);

  const imgW = (j.img_size && j.img_size[0]) ? j.img_size[0] : w;
  const imgH = (j.img_size && j.img_size[1]) ? j.img_size[1] : h;
  drawBoxes(dets, imgW, imgH);
}

btnRun.onclick = async ()=>{
  const ok = await checkHealth();
  if (!ok) return;

  // Start a sequential loop: one request at a time (no piling up, no out-of-order confusion)
  running = true;
  runToken++;
  const token = runToken;

  btnRun.disabled = true;
  btnStop.disabled = false;

  while (running && token === runToken){
    try{
      await inferOnce(token);
    }catch(e){
      // surface error in console, keep loop alive
      console.error(e);
    }
    const interval = Math.max(50, parseInt(intervalEl.value||"200",10));
    await sleep(interval);
  }
};
</script>
</body>
</html>
